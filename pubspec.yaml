name: "livescorex"
description: "Livescore mobile app"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  font_awesome_flutter: ^11.0.0
  lucide_icons: ^0.257.0
  http: ^1.3.0
  dio: ^5.8.0+1
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  flutter_svg: ^2.0.17
  google_mobile_ads: ^5.3.1
  json_annotation: ^4.9.0
  awesome_notifications: ^0.10.1
  flutter_background_service_android: ^6.3.0
  flutter_background_service: ^5.1.0
  provider: ^6.1.2
  flutter_ringtone_player: ^4.0.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  launcher_name: ^1.0.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons: #flutter pub run flutter_launcher_icons
  android: true
  ios: true
  image_path: "assets/logo4.jpg"  # Path to your icon image
  adaptive_icon_foreground: "assets/logo4.jpg"  # For Android adaptive icons
  adaptive_icon_background: "#FFFFFF"

launcher_name:
  name: "LivescoreX"

flutter:
  uses-material-design: true
  assets:
    - assets/leagues.json
    - assets/goal_alert.aac
